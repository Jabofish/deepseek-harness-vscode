packages:
  - apps/*
  - packages/*

# rc.2's published registry references Protocol in declarations but lists it
# only as a dev dependency. Keep its types separate from our legacy codecs.
packageExtensions:
  '@deepseek-ai/dsh-typert-registry@0.2.1-rc.2':
    dependencies:
      '@deepseek-ai/dsh-typert-protocol': '0.2.1-rc.2'

allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: true
  keytar: false

# Supply-chain policy: refuse packages published less than 1 day ago (value is
# in minutes; pnpm's default is already 1440, set here explicitly for clarity).
# This gate must stay effective for `@deepseek-ai/*`, whose code is compiled
# into the Extension Host and runs with full privileges; do not add those
# packages to the exclude list. The project tracks bleeding-edge `@deepseek-ai/*`
# alpha releases (some <48h old), which is why the cooldown is 1 day rather than
# longer. Only freshly-published, trusted build-time tooling that would
# otherwise stall packaging is exempted.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@vscode/vsce@4.1.0'
