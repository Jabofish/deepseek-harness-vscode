name: Bug report
description: Report a problem with JaboDSH
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English or 中文 is welcome. Include reproduction steps and the versions below.
        Use `JaboDSH: Show Redacted Diagnostics` for diagnostics and inspect the output before posting.
        Remove API keys, passwords, tokens, prompts, tool bodies and private paths.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: Paste the version from Help → About.
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: Paste the installed extension version from the Extensions view.
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: 'Output of `dsh --version`, or "not installed".'
      placeholder: Paste the exact output, including any prerelease suffix, or "not installed".
    validations:
      required: true
  - type: dropdown
    id: connection-mode
    attributes:
      label: Connection mode (`dsh.connection.mode`)
      options:
        - auto
        - attach-only
        - new-isolated
        - custom
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including any workspace or session state needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already performed (optional)
      description: Commands or manual steps you tried, and their results. Developer test suites are optional for bug reports.
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: 'Output of `JaboDSH: Show Redacted Diagnostics`, if available.'
  - type: textarea
    id: logs
    attributes:
      label: Output channel excerpt
      description: The `JaboDSH` output channel. Inspect the excerpt and remove secrets, prompts, tool bodies and private paths before posting; prefer the redacted diagnostics above.
