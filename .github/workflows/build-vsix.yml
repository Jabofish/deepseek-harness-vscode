name: Build VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0
  PNPM_VERSION: 11.19.0

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  package:
    name: Package ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: linux-x64
          - name: windows-x64
            os: windows-2022
            target: win32-x64
          - name: macos-x64
            os: macos-15-intel
            target: darwin-x64
          - name: macos-arm64
            os: macos-15
            target: darwin-arm64
          - name: universal
            os: ubuntu-24.04
            target: universal
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build webview and extension
        run: pnpm build

      - name: Package platform VSIX
        shell: bash
        run: |
          node -e "require('node:fs').mkdirSync('artifacts', { recursive: true })"
          if [ "${{ matrix.target }}" = "universal" ]; then
            pnpm --filter deepseek-harness-vscode exec vsce package \
              --no-dependencies \
              --allow-missing-repository \
              --out "../../artifacts/deepseek-harness-vscode-${{ matrix.name }}.vsix"
          else
            pnpm --filter deepseek-harness-vscode exec vsce package \
              --no-dependencies \
              --allow-missing-repository \
              --target "${{ matrix.target }}" \
              --out "../../artifacts/deepseek-harness-vscode-${{ matrix.name }}.vsix"
          fi

      - name: Upload platform VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.name }}
          path: artifacts/deepseek-harness-vscode-${{ matrix.name }}.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Visual Studio Marketplace
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download universal VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-universal
          path: artifacts

      - name: Check Marketplace credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Repository secret VSCE_PAT is required for Marketplace publishing."
            exit 1
          fi

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm --filter deepseek-harness-vscode exec vsce publish --packagePath artifacts/deepseek-harness-vscode-universal.vsix

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform VSIX files
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.vsix \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DeepSeek Harness VS Code ${GITHUB_REF_NAME}" \
            --generate-notes
