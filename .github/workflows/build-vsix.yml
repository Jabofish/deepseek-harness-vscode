name: Build VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish the checked-in extension version to the Visual Studio Marketplace'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vsix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0
  PNPM_VERSION: 11.19.0
  NODE_COMPILE_CACHE: ${{ github.workspace }}/node_modules/.cache/node-compile

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate release notes
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > /dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.cache/vitest
            node_modules/.cache/node-compile
          key: tests-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vitest*.ts', 'config/vitest*.ts') }}-${{ github.sha }}
          restore-keys: tests-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vitest*.ts', 'config/vitest*.ts') }}-
      - name: Run checks
        run: pnpm check

  package:
    name: Package ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: linux-x64
          - name: windows-x64
            os: windows-2022
            target: win32-x64
          - name: macos-x64
            os: macos-15-intel
            target: darwin-x64
          - name: macos-arm64
            os: macos-15
            target: darwin-arm64
          - name: universal
            os: ubuntu-24.04
            target: universal
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build webview and extension
        run: pnpm build

      - name: Package platform VSIX
        shell: bash
        run: |
          node -e "require('node:fs').mkdirSync('artifacts', { recursive: true })"
          if [ "${{ matrix.target }}" = "universal" ]; then
            pnpm --filter deepseek-harness-client exec vsce package \
              --no-dependencies \
              --no-gitHubIssueLinking \
              --allow-missing-repository \
              --out "../../artifacts/deepseek-harness-vscode-${{ matrix.name }}.vsix"
          else
            pnpm --filter deepseek-harness-client exec vsce package \
              --no-dependencies \
              --no-gitHubIssueLinking \
              --allow-missing-repository \
              --target "${{ matrix.target }}" \
              --out "../../artifacts/deepseek-harness-vscode-${{ matrix.name }}.vsix"
          fi

      - name: Record universal VSIX digest
        if: matrix.target == 'universal'
        shell: bash
        run: sha256sum artifacts/deepseek-harness-vscode-universal.vsix | tee artifacts/SHA256SUMS

      - name: Upload platform VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix-${{ matrix.name }}
          path: artifacts/deepseek-harness-vscode-${{ matrix.name }}.vsix
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal VSIX digest
        if: matrix.target == 'universal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix-universal-sha256
          path: artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest universal VSIX
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download universal VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix-universal
          path: artifacts

      - name: Download universal VSIX digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix-universal-sha256
          path: artifacts

      - name: Verify universal VSIX digest
        run: sha256sum -c artifacts/SHA256SUMS

      - name: Attest universal VSIX provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/deepseek-harness-vscode-universal.vsix

  publish:
    name: Publish to Visual Studio Marketplace
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    # Marketplace publishing requires an explicit manual opt-in, including for tagged releases.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_marketplace == true }}
    needs: [package, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Before enabling uploads, configure reviewers/ref rules on this environment,
    # move VSCE_PAT into it, and remove the repository-level secret. GitHub creates
    # missing environments without protection; this declaration cannot enforce setup.
    environment: marketplace
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # The credentialed runner must not execute dependency lifecycle scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download universal VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix-universal
          path: artifacts

      - name: Download universal VSIX digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix-universal-sha256
          path: artifacts

      - name: Verify universal VSIX digest
        run: sha256sum -c artifacts/SHA256SUMS

      - name: Check Marketplace credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Marketplace secret VSCE_PAT is required for publishing."
            exit 1
          fi

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm --filter deepseek-harness-client exec node ../../scripts/publish-marketplace.cjs

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Invalid release tag '$TAG'."; exit 1 ;;
          esac

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download platform VSIX files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true

      - name: Verify universal VSIX digest
        run: sha256sum -c artifacts/SHA256SUMS

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > artifacts/release-notes.md

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.vsix \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$TAG" artifacts/*.vsix \
              --repo "${GITHUB_REPOSITORY}" \
              --title "DeepSeek Harness VS Code $TAG" \
              --notes-file artifacts/release-notes.md
          fi
